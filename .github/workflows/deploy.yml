name: Deploy Rollin to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate production build
        run: |
          test -f index.html
          test -f fsbo.js
          test -f sw.js
          test -f account/index.html
          test -f sales/index.html
          test -f purchases/index.html
          test -f shop/index.html
          test -f real-estate/index.html
          test -f cars-trucks/index.html
          test -f boats/index.html
          test -f planes/index.html
          test -f contact-us/index.html
          test -f sitemap/index.html
          test -f sitemap.xml
          test -f robots.txt
          grep -q "https://way4out.github.io/Rollin/sitemap.xml" robots.txt
          grep -q "contact-us" sitemap.xml
          grep -q "sitemap" sitemap.xml
          grep -q "supabase" fsbo.js
          grep -q "rollin-stripe-fsbo-checkout" fsbo.js
          grep -q "rollin-verify-base-usdc" fsbo.js
          node --check fsbo.js
          node --check app.js
          for f in index.html account/index.html sales/index.html purchases/index.html shop/index.html real-estate/index.html cars-trucks/index.html boats/index.html planes/index.html; do
            grep -q "<html" "$f"
            grep -q "</html>" "$f"
          done
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -o -name '*.yaml' | wc -l)" -eq 1
          echo "Rollin production build validation passed."
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
