name: Quantum24 Native + Integration Regression
on:
  push:
    branches: [quantum24-production]
  pull_request:
    branches: [quantum24-production]
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --check quantum24/server.js
      - run: node --check quantum24/device-integration.js
      - run: npm install --prefix quantum24 --no-audit --no-fund
      - name: Local API smoke test
        run: |
          node quantum24/server.js > q24-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:10000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:10000/api/health >/dev/null
          curl -fsS http://127.0.0.1:10000/api/quantum/max-scan >/dev/null
          curl -fsS http://127.0.0.1:10000/api/device-integration/status >/dev/null
          curl -fsS http://127.0.0.1:10000/api/device-integration/reference-protocol >/dev/null
          echo "local API smoke passed"
      - run: node -e "const p=require('./quantum24/reference-accessory/quantum24-gatt-v1.json'); if(p.serviceUUID!=='7b5a0001-7f24-4c24-9b24-000000000024'||p.characteristics.telemetry.properties.indexOf('read')<0||p.characteristics.command.properties.indexOf('write')<0||p.characteristics.acknowledgment.properties.indexOf('notify')<0) process.exit(1); console.log('reference GATT protocol passed')"
      - run: node -e "const q=require('./quantum24/device-integration'); const d=q.registerDevice({platform:'ci',capabilities:['bluetooth','usb']}); const ok=q.transition(d.deviceId,{state:'ACTION_VERIFIED',evidence:{authorization:true,connection:true,telemetry:true,action:true}}); if(ok.device.state!=='CERTIFIED'||!ok.certified) process.exit(1); const blocked=q.registerDevice({platform:'ci'}); const bad=q.transition(blocked.deviceId,{state:'CERTIFIED',evidence:{}}); if(bad.certified||bad.device.state!=='EVIDENCE_REQUIRED') process.exit(1); console.log('device evidence gate passed')"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Build Android native target
        id: androidbuild
        continue-on-error: true
        run: |
          set +e
          gradle -p native/android :app:assembleDebug --stacktrace 2>&1 | tee android-build.log
          echo "exit_code=${PIPESTATUS[0]}" | tee -a android-build.log
          exit ${PIPESTATUS[0]}
      - name: Upload Android diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q24-android-diagnostic
          path: android-build.log
          if-no-files-found: warn
      - name: Enforce Android build
        if: steps.androidbuild.outcome == 'failure'
        run: exit 1
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate iOS/iPadOS target contract
        id: ioscheck
        continue-on-error: true
        run: |
          set +e
          test -f native/ios/project.yml
          test -f native/ios/Quantum24/Info.plist
          xcrun swiftc -typecheck -target arm64-apple-ios18.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" native/ios/Quantum24/Quantum24App.swift 2>&1 | tee ios-typecheck.log
          echo "exit_code=${PIPESTATUS[0]}" | tee -a ios-typecheck.log
          exit ${PIPESTATUS[0]}
      - name: Upload iOS diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q24-ios-diagnostic
          path: ios-typecheck.log
          if-no-files-found: warn
      - name: Enforce iOS validation
        if: steps.ioscheck.outcome == 'failure'
        run: exit 1
