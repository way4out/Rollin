<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Rollin Data Catalog</title></head><body><header class="topbar"><a class="brand" href="../../"><span class="logo">R</span><span>ROLLIN</span></a><nav><a class="nav-link active" href="../">Data Exchange</a><a class="nav-link active" href="./">Catalog</a><a class="nav-link" href="../sell/">Sell Data</a><a class="nav-link" href="../rights/">Data Rights</a><a class="nav-link" href="../api/">API</a><a class="nav-link" href="../compliance/">Compliance</a></nav><div class="top-actions"><a class="secondary" href="../../account/">Account</a></div></header><main class="page"><section class="section"><div class="eyebrow">DATA EXCHANGE · CATALOG</div><h1>Find a data product.</h1><p class="muted">Demo catalog uses synthetic examples. Real listings require provenance, permissions and applicable marketplace review.</p><div class="toolbar"><input class="search" id="q" placeholder="Search datasets, domains or formats" aria-label="Search catalog"><select class="search" id="kind" aria-label="Filter"><option value="">All types</option><option>Synthetic</option><option>De-identified</option><option>Public / Licensed</option><option>AI-generated</option><option>Market Data</option></select></div><div class="grid" id="grid"></div></section></main><script>const data=[["Synthetic Mobility Benchmark","Synthetic","Transportation","CSV · 2.1 GB"],["Retail Demand Signals","De-identified","Commerce","Parquet · 840 MB"],["Public Climate Archive","Public / Licensed","Climate","JSON · 4.4 GB"],["AI Text Evaluation Pack","AI-generated","AI","JSONL · 310 MB"],["US Equity Reference Snapshot","Market Data","Finance","API · licensed feed"]];const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));function draw(){let q=document.getElementById("q").value.toLowerCase(),k=document.getElementById("kind").value;let x=data.filter(a=>(!k||a[1]===k)&&a.join(" ").toLowerCase().includes(q));document.getElementById("grid").innerHTML=x.length?x.map(a=>'<article class="card"><div class="product-art"><span>◈</span></div><div class="card-body"><span class="tag">'+esc(a[1])+'</span><h3>'+esc(a[0])+'</h3><p class="muted">'+esc(a[2])+' · '+esc(a[3])+'</p><button class="primary full" onclick="alert(\'Demo product. Connect an approved listing backend before transacting.\')">View product</button></div></article>').join(""):'<div class="empty wide">No catalog matches. Try another search or filter.</div>'}document.getElementById("q").oninput=draw;document.getElementById("kind").onchange=draw;draw();</script></body></html>
